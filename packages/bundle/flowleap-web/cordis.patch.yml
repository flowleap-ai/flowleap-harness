# The dsh-flowleap-web bundle patch: the FlowLeap Patent Agent over the
# dsh-base and dsh-web-app layers. Applied after both, so rows here override
# theirs by id; the profile's own cordis.patch.yml and --patch overlays still
# come later.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.

# ── DeepSeek-specific rows off ───────────────────────────────────────────────
# The packages stay in the installation; this profile does not mount them.

- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

# Telemetry to DeepSeek: the Session-log export after a feedback click and the
# desktop product analytics both default to dsh-otel-collector.deepseeksvc.com.
# This profile sends no data to DeepSeek, whatever the environment says. The
# test apps/cli/tests/flowleap-web-no-deepseek-destinations.spec.ts fails when
# a mounted row has a default destination on a DeepSeek domain.
- id: session-telemetry-otel
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

# The account settings card and its controller wait for `deepseekAccount`,
# which the disabled row above provides.
- id: ui-settings-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-brand-official
  disabled: true

# The DeepSeek search-provider card and the DeepSeek session-log upload
# consent: both configure services the disabled rows above provide.
- id: ui-settings-web-search
  disabled: true

- id: ui-settings-session-log
  disabled: true

# ── developer surfaces off (flowleap-harness#84, #70) ──────────────────────
# Settings > Built-in plugins lists module names (`@deepseek-ai/dsh-…`) for
# developers; the desktop keeps the Plugins page, whose Built-in plugin
# settings hold the same configuration pages. The More menus offer no "Create
# your plugin": its Creator preset (preset-cordis) is off below.

- id: ui-settings-plugins
  disabled: true

- id: ui-settings-plugin-inventory
  disabled: true

- id: entry-customization
  config:
    createPlugin: false

# Plugin cards and plugin pages show product names, never package names
# (`@deepseek-ai/dsh-…`), row ids, or install specs (flowleap-harness#189).
- id: ui-plugin-manager
  config:
    packageNames: false

# New task on the Automation tasks page opens the new chat with an example
# request in the composer, unsent; ui-flowleap-routines supplies the patent
# example.
- id: ui-schedule
  config:
    newTaskDraft: true

# ── optional bundles this product does not offer ────────────────────────────
# Live Share shows Sessions to share viewers, and Forge works with GitHub. A
# firm runtime must not offer either, so the Plugins page hides them and
# refuses to switch them on. Attorneys do not install, update, or switch on
# packages: the firm administrator does that through flowleap-os
# (installBundles: false, offeredBundles: []). The Plugins page hides the SDK
# bundles only in the client, so the Host refuses every new selection.

- id: plugin-manager
  config:
    installBundles: false
    offeredBundles: []
    withheldBundles:
      - '@deepseek-ai/dsh-experimental-liveshare'
      - '@deepseek-ai/dsh-experimental-forge-bundle'

# ── the patent preset is the default ─────────────────────────────────────────
# `presets/patent.patch.yml` inserts the `patent` declaration (standard's
# plugin list without the coding persona). `presets/standard.patch.yml` and
# `presets/ptc.patch.yml` restate those presets with `tool-web` off; standard,
# ptc and minimal stay selectable.

- id: agent-preset-registry
  config:
    default: patent

# Off: the cordis preset mounts tool-web, and this profile offers no web tool (flowleap-harness#101).
- id: preset-cordis
  disabled: true

# ── the Patent Agent prompt ──────────────────────────────────────────────────
# No harness identity and no persona prefix: the flowleap-prompt row below
# supplies the persona as the `flowleap:patent-agent` section.

- id: system-prompt
  config:
    includeHarnessIdentity: false

# ── providers and the default model ──────────────────────────────────────────
# Three pi-ai catalog routes; each key is resolved per request through the
# credential seam, so no secret enters this file. subscriptionSignIn: false
# offers no subscription sign-in (Claude Pro or Max): Anthropic does not permit
# one in a third-party application. The attorney sets a key and adds a route on
# the Models page. A firm server stacks dsh-flowleap-firm over this bundle, which
# fixes the routes and keys (flowleap-harness#61) and restates this row.
#
# The firm's model gateway sends x-flowleap-budget-warning from 80 % of a
# budget (flowleap-harness#32); the two routes that go through the gateway
# show its value to the attorney in the chat, and the model never sees it.
#
# package.json dsh.bundle.lockedRows names the plugin manager row and the
# DeepSeek rows: the Loader drops a user patch (profile or home
# cordis.patch.yml) that targets one of them, so the plugin manager cannot
# switch a DeepSeek route, sign-in, or telemetry row on.

- id: llm-pi-ai
  config:
    subscriptionSignIn: false
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        noticeHeaders: [x-flowleap-budget-warning]
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        noticeHeaders: [x-flowleap-budget-warning]
      mistral:
        apiKeyEnv: MISTRAL_API_KEY

- id: agent-default-model
  config:
    provider: anthropic
    model: claude-sonnet-5-5

# ── the FlowLeap skill pack ──────────────────────────────────────────────────
# dsh-web-app disables this host row because each preset mounts its own
# `filesystem` provider for project and user roots. Re-enabled here as a second,
# global-layer provider that scans only the FlowLeap methods pack
# (`<name>/SKILL.md` bundles), so every preset's `tool-skill` catalog merges it
# with the preset's own roots.
#
# FLOWLEAP_SKILLS_DIR names the pack folder; when it is unset or empty, the
# default is the pack of the release image. The folder must exist, or the row fails at load: outside the
# image, set FLOWLEAP_SKILLS_DIR to a flowleap-methods checkout's skills/,
# or to an empty folder for no FlowLeap skill.

- id: skill-filesystem
  disabled: false
  config:
    providerName: flowleap
    includeDefaultRoots: false
    requireCustomSkillDirs: true
    customSkillDirs:
      - !!js process.env.FLOWLEAP_SKILLS_DIR || '/opt/flowleap/skills'

# Settings > Skills (flowleap-harness#190): every skill of a new chat with its
# source, the replace note, and the skill files with faults. The skill pack
# row above registers as provider `flowleap`; its skills show as FlowLeap methods.

- insert:
    - id: ui-settings-skills
      name: '@deepseek-ai/dsh-client-ui-settings-skills'
      config:
        pluginNames:
          flowleap: FlowLeap methods

# ── uploads while the firm server's disk is low ──────────────────────────────
# The firm host writes /run/flowleap/host/disk-low (read-only in the runtime)
# while its disk is low, and removes it when space comes back
# (flowleap-harness#62). While the file exists, chat attachments are refused
# with STORAGE_LOW; reads, chats and the attachments a tool stores go on. The
# agent builder row below reads the same flag.

- id: attachment-local
  config:
    storageLowFlagPath: /run/flowleap/host/disk-low

# ── the shell sandbox ────────────────────────────────────────────────────────
# A confined command reaches no IP network: web access goes through the web
# tools, and an unconfined run (danger-full-access) needs the attorney's
# approval. This protects against a prompt injection that sends data out
# through a shell command.

- id: sandbox
  config:
    network: deny

# The upstream MCP server manager takes servers from Settings writes, stdio
# commands included, with no firm-admin check. Off until Connectors and admin
# approval land (flowleap-harness#197, #199); the FlowLeap MCP row below does not need it.
- id: mcp-manager
  disabled: true

# ── FlowLeap rows ────────────────────────────────────────────────────────────

- insert:
    # The hosted FlowLeap MCP server through the signed-in `flowleap` CLI on
    # PATH; its tools register as `mcp__flowleap__<tool>`. A failed connection
    # logs and the harness still starts.
    #
    # ADR 0019 decision 3: this row carries only the paid set the backend keeps
    # — PATSTAT, analytics and US full text. The office tools (`search_patents`,
    # `get_bibliography`, …), the drawings and US office-action citations
    # (`get_patent_image`, `search_office_action_citations`,
    # `search_enriched_citations`, `get_citation_stats`, `examiner_baseline`:
    # free data on the firm's own keys, flowleap-harness#180) and OCR (`ocr`,
    # `read_pdf`, on the firm's Mistral key since C3) come from
    # `dsh-flowleap-connectors` below. A name the local row registers is never
    # listed here, so the model sees one tool per name, with one exception. `get_claims` is ALSO here: the native copy
    # has no US source (`usFulltext` is absent on a self-hosted harness) and
    # answers US claims `not_configured` naming the paid route
    # `mcp__flowleap__get_claims`, the backend's tool of the same name over
    # this row (ADR 0019 decision 5; S5 acceptance 2026-10-25 found the name
    # unregistered). `get_description` has no US source on either host, so it
    # stays native only. `get_fulltext` stays on the MCP side for US full text.
    - id: mcp-flowleap
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: flowleap
        transport: stdio
        command: flowleap
        args: ['mcp']
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        tools:
          include:
            - server_info
            - patent_analytics
            - get_fulltext
            - get_claims
            - patstat_portfolio
            - patstat_docs
            - patstat_query
            - patstat_resolve
            - patstat_cpc
            - patstat_patent
            - patstat_applicant
            - patstat_technology
            - patstat_neighborhood
            - patstat_path
            - patstat_explain

    # In-process patent-data connectors (ADR 0019 C2): the @flowleap/connectors
    # library over this process's credential store, with the office tools
    # (`search_patents`, `get_bibliography`, `search_academic`, `ocr`, no prefix)
    # and the native `read_pdf` (workspace file → Mistral OCR on the firm's key)
    # on the tool registry and the `flowleapConnectors` Remote behind the cards.
    # Keys live in the credential store under `flowleap-connectors/<id>`.
    - id: flowleap-connectors
      name: '@deepseek-ai/dsh-flowleap-connectors'
      config:
        cacheEntries: 500
        # get_fulltext stays on the MCP row: its US arm needs the usFulltext host capability,
        # which the harness does not provide, so the paid backend copy answers instead.
        excludeTools: [get_fulltext]

    # The deliverable tools (S5 D1): write_patent_results with the IDE's report
    # templates, evidence validation against this session's recorded tool
    # results (the ledger listens on tools/result for the office and paid MCP
    # tools above), the working record and the delivery card. The second read
    # judges on the session's own model; `secondReadModel: provider/model`
    # pins another route.
    - id: flowleap-deliverables
      name: '@deepseek-ai/dsh-flowleap-deliverables'
      config:
        secondRead: render
        secondReadModel: ''

    # Office tools (Word letters on firm templates, claim amendments as Word
    # tracked changes, Excel claim charts) on the pinned OfficeCLI binary. Both
    # rows stay off here: the firm image adds the binary and switches them on
    # with deploy/office.patch.yml. The provider row runs the binary through
    # the `sandbox` row above (no network). The provider row checks the binary's SHA-256 and --version at load
    # and is the only code that runs it; the main row reads templates only
    # from templatesDir.
    - id: flowleap-office-officecli
      name: '@deepseek-ai/dsh-flowleap-office/officecli'
      disabled: true
      config:
        binaryPath: /opt/flowleap/officecli/officecli
        version: 1.0.160
        sha256: baa084b64ec634bd9d41a0592db3ed85f11658b358bab898679537ea7f3e73a9
        stateDir: !!js dshHomePath('flowleap-office')
        timeoutMs: 60000
        maxOutputBytes: 4194304
        tableStyle: ''
        chart:
          featureColumnWidth: 10
          textColumnWidth: 40
          headerFill: 1F3A5F
          headerFontColor: FFFFFF

    - id: flowleap-office
      name: '@deepseek-ai/dsh-flowleap-office'
      disabled: true
      config:
        templatesDir: /opt/flowleap/templates
        revisionAuthor: FlowLeap
        maxReadChars: 40000
        maxInputBytes: 33554432

    # Routines (ADR 0001 decision 27): `register_watch_create` makes a daily
    # scheduled task that reads the watched EP and US registers through the
    # connectors row above without a model call, and runs only when an event
    # is new. Two reads a day per application at most (EPO OPS fair use); the
    # reads of one run end at the deadline, and the run lists bounded office text.
    - id: flowleap-routines
      name: '@deepseek-ai/dsh-flowleap-routines'
      config:
        minReadIntervalHours: 12
        maxApplications: 20
        readDeadlineSeconds: 120
        maxEventsPerRun: 50
        maxEventTextLength: 300

    # Settings > Connectors (one card per connector); the row id is
    # also the wizard's settings namespace. The firm's people land on My work,
    # and the data keys are the administrator's task, so the first-run key
    # wizard never opens here: `wizardDismissed` starts true, and an
    # administrator enters the keys in Settings > Connectors.
    - id: ui-settings-flowleap-connectors
      name: '@deepseek-ai/dsh-client-ui-settings-flowleap-connectors'
      config:
        wizardDismissed: true

    # The dashboard (flowleap-harness#60): the landing page of ui-workspace,
    # so the first screen after sign-in, or the chat or page that the address
    # names (?chat=, ?page=), with the ask bar and its search groups (Cmd+K),
    # the dashboard.metric and dashboard.widget slots that apps fill, the
    # Install FlowLeap card, and the OS sidebar layers (Search, the Dashboard,
    # Chats and Agents apps, Pinned).
    - id: ui-flowleap-dashboard
      name: '@deepseek-ai/dsh-client-ui-flowleap-dashboard'

    # Budget this month and Budget used on the dashboard: the attorney's model
    # spend and budget of this month, read from the firm's model gateway with
    # the runtime's own virtual key (the ANTHROPIC_API_KEY credential, the key
    # of the gateway routes above). The firm patch sets baseURL to the base URL
    # of the gateway routes (llm-pi-ai providers.*.baseURL); no service exposes
    # the configured route endpoint, so the value has two homes in that patch.
    # Without baseURL, as in a local run against Anthropic itself, both show
    # "Unknown" and the reason, never a number.
    - id: flowleap-budget
      name: '@deepseek-ai/dsh-flowleap-budget'
      config:
        apiKeyRef: ANTHROPIC_API_KEY
        timeoutMs: 5000

    - id: ui-flowleap-budget
      name: '@deepseek-ai/dsh-client-ui-flowleap-budget'

    # The Firm Record of flowleap-os (design PR 214, phase R0): the runtime
    # reads one matter's view through the flowleapRecord seam and never writes
    # a decision. The http provider reads GET /records/api/matters/<file
    # number>/view at the firm patch's baseURL with the runtime's record token
    # (the FLOWLEAP_RECORD_TOKEN ref of the keys document); without baseURL,
    # as in a local run, every read answers not_configured. The tool row gives
    # the model record_read, whose JSON result names recordSeq and viewHash,
    # so the Session log holds the record position a model answer rests on.
    - id: flowleap-record-http
      name: '@deepseek-ai/dsh-flowleap-record/http'
      config:
        apiKeyRef: FLOWLEAP_RECORD_TOKEN
        timeoutMs: 5000

    - id: flowleap-record
      name: '@deepseek-ai/dsh-flowleap-record'

    # My work (the first screen and the landing page) and the Matters row in
    # the sidebar (German Akten): the IPMS views over the Records API of the
    # Firm Record, which the firm proxy serves at the same origin under
    # recordsHref; a decision goes from the view to the Firm Record, never
    # through the runtime. The account button at the sidebar foot signs out
    # through signOutHref, which the firm patch sets to the sign-in proxy's
    # path (oauth2/sign_out?rd=%2F); empty here, so a run without the proxy
    # shows no Sign out. Without the proxy the views say that FlowLeap could
    # not load them.
    - id: ui-flowleap-records
      name: '@deepseek-ai/dsh-client-ui-flowleap-records'
      config:
        recordsHref: records/
        signOutHref: ''

    # The Clients row in the sidebar (German Mandanten) and the client folder
    # page: a client's workspace folder with no chat, its files open in the
    # middle, New folder, Upload files, Rename, Move to, and Ask about this.
    # Writes stay inside the client folder and never replace an entry; uploads
    # stop while the disk-low flag of the Host exists, as attachments do.
    # Add client builds new client folders in clientsRoot. The firm patch sets
    # firmIdentity (the firm's names, addresses and representatives); while it
    # is empty, Add client finds no matter at your firm. With it, the row reads
    # the firm docket (the firm's EP applications) from the EP Register at load.
    # Only a firm administrator may save Settings > Firm identity: the row asks
    # the flowleapAdmin Service of flowleap-admin-link below, so the starter's
    # key path has one home. After the first save, firmIdentity has no effect.
    - id: ui-flowleap-folder
      name: '@deepseek-ai/dsh-client-ui-flowleap-folder'
      config:
        stateDir: !!js dshHomePath('flowleap-folder')
        storageLowFlagPath: /run/flowleap/host/disk-low
        clientsRoot: !!js dshHomePath('clients')

    # The Firm admin row in the sidebar (flowleap-harness#112), shown only to a
    # firm administrator: the starter of flowleap-os signs an X-Flowleap-Admin
    # header on each request of an administrator, and this row checks it with
    # the starter's public key. The firm patch of flowleap-os restates this row
    # with publicKeyFile: /run/flowleap/host/admin-link.pub; with '' no request
    # shows the link. The row also provides the flowleapAdmin Service with the
    # same check, which the Firm identity save of ui-flowleap-folder uses.
    - id: flowleap-admin-link
      name: '@deepseek-ai/dsh-client-ui-flowleap-admin-link'
      config:
        publicKeyFile: ''
        consoleHref: admin/

    # The Needs review mark of the routines row above: a Sidebar row badge, a
    # Needs review page, Mark as done in the chat header, and a Needs review
    # tab on the Automation tasks page.
    - id: ui-flowleap-routines
      name: '@deepseek-ai/dsh-client-ui-flowleap-routines'

    # Work pages (flowleap-harness#81), look-first stage: the Office actions
    # launcher and the office action board with one sample analysis. No
    # Remote, model, or connector call; changes stay in the browser.
    - id: ui-flowleap-work-pages
      name: '@deepseek-ai/dsh-client-ui-flowleap-work-pages'

    # The agent builder (#55): one agent preset for each folder below
    # $DSH_HOME/agents, built on the patent preset with the agent's
    # instructions, its files (in the system prompt up to the limit, else a
    # search and a read tool over an FTS5 index) and only the chosen
    # connectors. firmRoot names a read-only folder of firm agents; the Host
    # never writes there. While the firm host's disk low flag exists, an upload
    # is refused (flowleap-harness#62).
    - id: flowleap-agent-builder
      name: '@deepseek-ai/dsh-flowleap-agent-builder'
      config:
        contextLimitTokens: 50000
        charsPerToken: 4
        maxFileBytes: 52428800
        basePreset: patent
        presetOrder: 100
        maxSearchResults: 8
        maxReadLocations: 10
        maxReadChars: 40000
        extractTimeoutMs: 120000
        maxPages: 2000
        extractMemoryMb: 512
        storageLowFlagPath: /run/flowleap/host/disk-low

    # The agent builder form: a New agent row in the new-session agent picker
    # and the agent form (name, description, instructions, files, connectors).
    - id: ui-flowleap-agent-builder
      name: '@deepseek-ai/dsh-client-ui-flowleap-agent-builder'

    # The brand: one brand.json (name, tagline, mark, accent) read by the Host
    # and rendered by the browser half into the sidebar, the blank-session
    # hero, the document title and the product copy. FLOWLEAP_BRAND_PATH names
    # a firm's own file; the default is this bundle's brand/brand.json,
    # resolved through the dsh installation that launched the profile.
    - id: ui-brand-flowleap
      name: '@deepseek-ai/dsh-client-ui-brand-flowleap'
      config:
        path: !!js "process.env.FLOWLEAP_BRAND_PATH ?? process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').installAnchor).resolve('@deepseek-ai/dsh-flowleap-web/brand/brand.json')"

    # The persona file: FLOWLEAP_PROMPT_PATH (the agent-v2 export) or this
    # bundle's placeholder, resolved through the dsh installation that
    # launched the profile.
    - id: flowleap-prompt
      name: '@deepseek-ai/dsh-flowleap-prompt'
      config:
        path: !!js "process.env.FLOWLEAP_PROMPT_PATH ?? process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').installAnchor).resolve('@deepseek-ai/dsh-flowleap-web/prompt/patent-agent.md')"
