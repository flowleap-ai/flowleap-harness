# The dsh-flowleap-web bundle patch: the FlowLeap Patent Agent over the
# dsh-base and dsh-web-app layers. Applied after both, so rows here override
# theirs by id; the profile's own cordis.patch.yml and --patch overlays still
# come later.
#
# A patch replaces the targeted row's whole `config`, so each row below
# restates every key it owns.

# ── DeepSeek-specific rows off ───────────────────────────────────────────────
# The packages stay in the installation; this profile does not mount them.

- id: deepseek-llm-api-extensions
  disabled: true

- id: session-log-deepseek
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

- id: deepseek-account
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

# The account settings card and its controller wait for `deepseekAccount`,
# which the disabled row above provides.
- id: ui-settings-account
  disabled: true

- id: account-controller
  disabled: true

- id: ui-brand-official
  disabled: true

# The DeepSeek search-provider card and the DeepSeek session-log upload
# consent: both configure services the disabled rows above provide.
- id: ui-settings-web-search
  disabled: true

- id: ui-settings-session-log
  disabled: true

# ── optional bundles this product does not offer ────────────────────────────
# Live Share shows Sessions to share viewers, and Forge works with GitHub. A
# firm runtime must not offer either, so the Plugins page hides them and
# refuses to switch them on.

- id: plugin-manager
  config:
    withheldBundles:
      - '@deepseek-ai/dsh-experimental-liveshare'
      - '@deepseek-ai/dsh-experimental-forge-bundle'

# ── the patent preset is the default ─────────────────────────────────────────
# `presets/patent.patch.yml` inserts the `patent` declaration (standard's
# plugin list without the coding persona); standard, ptc, minimal and cordis
# stay selectable.

- id: agent-preset-registry
  config:
    default: patent

# ── the Patent Agent prompt ──────────────────────────────────────────────────
# No harness identity and no persona prefix: the flowleap-prompt row below
# supplies the persona as the `flowleap:patent-agent` section.

- id: system-prompt
  config:
    includeHarnessIdentity: false

# ── providers and the default model ──────────────────────────────────────────
# Three pi-ai catalog routes; each key is resolved per request through the
# credential seam, so no secret enters this file.

- id: llm-pi-ai
  config:
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
      mistral:
        apiKeyEnv: MISTRAL_API_KEY

- id: agent-default-model
  config:
    provider: anthropic
    model: claude-sonnet-5-5

# ── the FlowLeap skill pack ──────────────────────────────────────────────────
# dsh-web-app disables this host row because each preset mounts its own
# `filesystem` provider for project and user roots. Re-enabled here as a second,
# global-layer provider that scans only the flowleap-plugins pack
# (`<name>/SKILL.md` bundles), so every preset's `tool-skill` catalog merges it
# with the preset's own roots.
#
# FLOWLEAP_SKILLS_DIR names the pack folder; the default is the pack of the
# release image. The folder must exist, or the row fails at load: outside the
# image, set FLOWLEAP_SKILLS_DIR to a flowleap-plugins checkout's
# plugins/flowleap/skills, or to an empty folder for no FlowLeap skill.

- id: skill-filesystem
  disabled: false
  config:
    providerName: flowleap
    includeDefaultRoots: false
    requireCustomSkillDirs: true
    customSkillDirs:
      - !!js process.env.FLOWLEAP_SKILLS_DIR ?? '/opt/flowleap/skills'

# ── the shell sandbox ────────────────────────────────────────────────────────
# A confined command reaches no IP network: web access goes through the web
# tools, and an unconfined run (danger-full-access) needs the attorney's
# approval. This protects against a prompt injection that sends data out
# through a shell command.

- id: sandbox
  config:
    network: deny

# ── FlowLeap rows ────────────────────────────────────────────────────────────

- insert:
    # The hosted FlowLeap MCP server through the signed-in `flowleap` CLI on
    # PATH; its tools register as `mcp__flowleap__<tool>`. A failed connection
    # logs and the harness still starts.
    #
    # ADR 0019 decision 3: this row carries only the paid set the backend keeps
    # (flowleap-backend #608) — PATSTAT, enriched citations, examiner baseline,
    # images, analytics. The office tools (`search_patents`,
    # `get_bibliography`, …) and OCR (`ocr`, `read_pdf`, on the firm's Mistral
    # key since C3) come from `dsh-flowleap-connectors` below and are not
    # listed here, with one exception. `get_claims` is ALSO here: the native copy
    # has no US source (`usFulltext` is absent on a self-hosted harness) and
    # answers US claims `not_configured` naming the paid route
    # `mcp__flowleap__get_claims`, the backend's tool of the same name over
    # this row (ADR 0019 decision 5; S5 acceptance 2026-10-25 found the name
    # unregistered). `get_description` has no US source on either host, so it
    # stays native only. `get_fulltext` stays on the MCP side for US full text.
    - id: mcp-flowleap
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: flowleap
        transport: stdio
        command: flowleap
        args: ['mcp']
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        tools:
          include:
            - server_info
            - get_patent_image
            - search_office_action_citations
            - search_enriched_citations
            - get_citation_stats
            - examiner_baseline
            - patent_analytics
            - get_fulltext
            - get_claims
            - patstat_portfolio
            - patstat_docs
            - patstat_query
            - patstat_resolve
            - patstat_cpc
            - patstat_patent
            - patstat_applicant
            - patstat_technology
            - patstat_neighborhood
            - patstat_path
            - patstat_explain

    # In-process patent-data connectors (ADR 0019 C2): the @flowleap/connectors
    # library over this process's credential store, with the office tools
    # (`search_patents`, `get_bibliography`, `search_academic`, `ocr`, no prefix)
    # and the native `read_pdf` (workspace file → Mistral OCR on the firm's key)
    # on the tool registry and the `flowleapConnectors` Remote behind the cards.
    # Keys live in the credential store under `flowleap-connectors/<id>`.
    - id: flowleap-connectors
      name: '@deepseek-ai/dsh-flowleap-connectors'
      config:
        cacheEntries: 500
        # get_fulltext stays on the MCP row: its US arm needs the usFulltext host capability,
        # which the harness does not provide, so the paid backend copy answers instead.
        excludeTools: [get_fulltext]

    # The deliverable tools (S5 D1): write_patent_results with the IDE's report
    # templates, evidence validation against this session's recorded tool
    # results (the ledger listens on tools/result for the office and paid MCP
    # tools above), the working record and the delivery card. The second read
    # judges on the session's own model; `secondReadModel: provider/model`
    # pins another route.
    - id: flowleap-deliverables
      name: '@deepseek-ai/dsh-flowleap-deliverables'
      config:
        secondRead: render
        secondReadModel: ''

    # Routines (ADR 0001 decision 27): `register_watch_create` makes a daily
    # scheduled task that reads the watched EP and US registers through the
    # connectors row above without a model call, and runs only when an event
    # is new. Two reads a day per application at most (EPO OPS fair use); the
    # reads of one run end at the deadline, and the run lists bounded office text.
    - id: flowleap-routines
      name: '@deepseek-ai/dsh-flowleap-routines'
      config:
        minReadIntervalHours: 12
        maxApplications: 20
        readDeadlineSeconds: 120
        maxEventsPerRun: 50
        maxEventTextLength: 300

    # Settings > Patent data connectors (one card per connector) and the
    # first-run key wizard; the row id is also the wizard's settings namespace.
    - id: ui-settings-flowleap-connectors
      name: '@deepseek-ai/dsh-client-ui-settings-flowleap-connectors'

    # The Needs review mark of the routines row above: a Sidebar row badge, a
    # Needs review page, Mark as done in the chat header, and a Needs review
    # tab on the Automation tasks page.
    - id: ui-flowleap-routines
      name: '@deepseek-ai/dsh-client-ui-flowleap-routines'

    # The agent builder (#55): one agent preset for each folder below
    # $DSH_HOME/agents, built on the patent preset with the agent's
    # instructions, its files (in the system prompt up to the limit, else a
    # search and a read tool over an FTS5 index) and only the chosen
    # connectors. firmRoot names a read-only folder of firm agents; the Host
    # never writes there.
    - id: flowleap-agent-builder
      name: '@deepseek-ai/dsh-flowleap-agent-builder'
      config:
        contextLimitTokens: 50000
        charsPerToken: 4
        maxFileBytes: 52428800
        basePreset: patent
        presetOrder: 100
        maxSearchResults: 8
        maxReadLocations: 10
        maxReadChars: 40000
        extractTimeoutMs: 120000
        maxPages: 2000
        extractMemoryMb: 512

    # The agent builder form: a New agent row in the new-session agent picker
    # and the agent form (name, description, instructions, files, connectors).
    - id: ui-flowleap-agent-builder
      name: '@deepseek-ai/dsh-client-ui-flowleap-agent-builder'

    # The brand: one brand.json (name, tagline, mark, accent) read by the Host
    # and rendered by the browser half into the sidebar, the blank-session
    # hero, the document title and the product copy. FLOWLEAP_BRAND_PATH names
    # a firm's own file; the default is this bundle's brand/brand.json,
    # resolved through the dsh installation that launched the profile.
    - id: ui-brand-flowleap
      name: '@deepseek-ai/dsh-client-ui-brand-flowleap'
      config:
        path: !!js "process.env.FLOWLEAP_BRAND_PATH ?? process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').installAnchor).resolve('@deepseek-ai/dsh-flowleap-web/brand/brand.json')"

    # The persona file: FLOWLEAP_PROMPT_PATH (the agent-v2 export) or this
    # bundle's placeholder, resolved through the dsh installation that
    # launched the profile.
    - id: flowleap-prompt
      name: '@deepseek-ai/dsh-flowleap-prompt'
      config:
        path: !!js "process.env.FLOWLEAP_PROMPT_PATH ?? process.getBuiltinModule('node:module').createRequire(ctx.get('profileContext').installAnchor).resolve('@deepseek-ai/dsh-flowleap-web/prompt/patent-agent.md')"
