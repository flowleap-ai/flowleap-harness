# Overlay for budget-warning.md (DSH_VERIFY_PATCH): the openrouter route goes
# through the gateway double at $DSH_VERIFY_GATEWAY_URL. An override replaces the
# row's whole config, so this restates fixedRoutes and every route of
# packages/bundle/flowleap-web/cordis.patch.yml.
- id: llm-pi-ai
  config:
    fixedRoutes: true
    providers:
      anthropic:
        apiKeyEnv: ANTHROPIC_API_KEY
        noticeHeaders: [x-flowleap-budget-warning]
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
        baseURL: !!js process.env.DSH_VERIFY_GATEWAY_URL
        noticeHeaders: [x-flowleap-budget-warning]
      mistral:
        apiKeyEnv: MISTRAL_API_KEY
