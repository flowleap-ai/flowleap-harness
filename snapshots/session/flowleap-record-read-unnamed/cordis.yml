# record_read over a Firm Record fixture whose matter has a responsible attorney with
# no display name yet and one filed letter with no event code and no date: the fixture
# provides flowleapRecord, and the tool row is mounted as the flowleap-web
# bundle mounts it.
- insert:
    - id: flowleap-record-fixture
      name: './flowleap-record-fixture.mjs'

    - id: flowleap-record
      name: '@deepseek-ai/dsh-flowleap-record'
