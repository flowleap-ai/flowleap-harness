# Keyless replay counterpart: the Firm Record stays a fixture; only the model
# adapter is replaced by replay.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: deepseek-official
            name: DeepSeek
            models:
              - id: deepseek-v4-flash
              - id: deepseek-v4-pro

- insert:
    - id: flowleap-record-fixture
      name: './flowleap-record-fixture.mjs'

    - id: flowleap-record
      name: '@deepseek-ai/dsh-flowleap-record'
