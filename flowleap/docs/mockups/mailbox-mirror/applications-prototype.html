<style>

  [dir="rtl"] [data-cut].is-cut, [data-cut][dir="rtl"].is-cut { -webkit-mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); mask-image: linear-gradient(to left, #000 calc(100% - 32px), transparent); }
  .p-wrap { overflow-wrap: anywhere; }

  .lt h2.clamp { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .lt-more { border: 0; background: none; padding: 0; margin: -8px 0 16px; color: var(--dsw-alias-label-secondary); font: inherit; cursor: pointer; text-decoration: underline; }

  .lt-top .lbl { white-space: nowrap; }
  .lt { container-type: inline-size; }
  @container (max-width: 520px) { .lt-top-in .lbl { display: none; } .lt-top-in .p-btn { width: 32px; padding: 0; justify-content: center; } }
  .lt-top-in { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
  .lt-crumb { display: none; }
  /* the PDF: a toolbar with zoom, and a wide reading mode */
  .pdf-bar { position: sticky; top: -24px; z-index: 2; display: flex; align-items: center; gap: 4px; padding: 8px 0; margin-bottom: 8px; background: var(--dsw-alias-bg-base); }
  .pdf-bar .sp { flex: 1; }
  .pdf-bar .pg { color: var(--dsw-alias-label-secondary); white-space: nowrap; padding: 0 8px; }
  .pdf-bar .z { min-width: 48px; text-align: center; font-variant-numeric: tabular-nums; }

  .a-wrap.wide { grid-template-columns: minmax(0, 1fr); }

  .a-wrap.wide .lt-props, .a-wrap.wide .lt-note { display: none; }
  .a-wrap.wide .lt h2 { font-size: var(--dsw-font-s-14-font-size); line-height: var(--dsw-font-s-14-line-height); max-width: none; margin: 8px 0; }
  .a-select { display: none; }
  .a-list .p-bar { min-width: 0; }
  .p-search { min-width: 0; }
  .a-list .a-select { flex: none; }
  .a-wrap.wide .lt-more { display: none; }
  .a-wrap.wide .lt h2.clamp { display: block; }
  .proto .st { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }

  /* A: three panes, as Outlook */
  .a-wrap { display: grid; grid-template-columns: 208px 380px minmax(0, 1fr); flex: 1; min-height: 0; }
  .a-wrap > * { min-height: 0; overflow: auto; }
  .a-folders { padding: 12px 8px; border-right: 0.5px solid var(--dsw-alias-border-l3); }
  .a-fh { padding: 12px 8px 4px; color: var(--dsw-alias-label-secondary); font-size: var(--dsw-font-xxs-12-font-size); }
  .a-f { display: flex; align-items: center; gap: 8px; width: 100%; height: 32px; padding: 0 8px; border: 0; border-radius: var(--dsw-radius-sm); background: transparent; color: var(--dsw-alias-label-primary); font: inherit; cursor: pointer; text-align: left; }
  .a-f:hover { background: var(--dsw-alias-interactive-bg-hover); }

  .a-row .l1 { display: flex; gap: 8px; align-items: baseline; min-width: 0; }

  .a-row .t { overflow-wrap: anywhere; }
  .a-row .l1 .d { margin-left: auto; flex: none; color: var(--dsw-alias-label-secondary); font-size: var(--dsw-font-xxs-12-font-size); }

  .a-row .t { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .a-row.is-new .p-who, .a-row.is-new .t { font-weight: var(--dsw-font-xs-strong-13-font-weight); }

  /* B: full-width rows and a drawer, as Gmail */
  .b-tabs { display: flex; gap: 8px; padding: 8px 16px; border-bottom: 0.5px solid var(--dsw-alias-border-l3); overflow: auto; flex: none; }
  .b-body { position: relative; flex: 1; min-height: 0; overflow: hidden; }
  .b-rows { height: 100%; overflow: auto; }
  .b-row { display: grid; grid-template-columns: 8px 176px minmax(0, 1fr) 152px 120px 96px; gap: 16px; align-items: center; height: 44px; padding: 0 16px; border-bottom: 0.5px solid var(--dsw-alias-border-l3); cursor: pointer; }
  .b-row:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .b-row.sel { background: var(--dsw-alias-interactive-bg-active); }
  .b-row.is-new .p-who, .b-row.is-new .t { font-weight: var(--dsw-font-xs-strong-13-font-weight); }
  .b-row .d { text-align: right; color: var(--dsw-alias-label-secondary); }
  .b-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(640px, 100%); border-left: 0.5px solid var(--dsw-alias-border-l2); box-shadow: var(--dsw-elevation-prominent); transform: translateX(104%); transition: transform var(--ds-transition-duration) var(--ds-ease-in-out); }
  .b-drawer.open { transform: none; }

  /* C: a table grouped by application, with the letter beside it */
  .c-wrap { display: grid; grid-template-columns: minmax(0, 1fr); flex: 1; min-height: 0; }
  .c-wrap.open { grid-template-columns: minmax(0, 1fr) minmax(400px, 44%); }

  .c-side { border-left: 0.5px solid var(--dsw-alias-border-l3); overflow: hidden !important; }
  .c-tbl { width: 100%; border-collapse: collapse; }
  .c-tbl th { position: sticky; top: 0; z-index: 2; height: 32px; padding: 0 16px; text-align: left; font-weight: 400; font-size: var(--dsw-font-xxs-12-font-size); color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-bg-base); border-bottom: 0.5px solid var(--dsw-alias-border-l3); white-space: nowrap; }
  .c-tbl td { height: 44px; padding: 0 16px; white-space: nowrap; }
  .c-tbl td.t { white-space: normal; min-width: 240px; }
  .c-tbl tr.g td { height: 36px; background: var(--dsw-alias-bg-multi-select); position: sticky; top: 32px; z-index: 1; }
  .c-tbl tr.r { cursor: pointer; }
  .c-tbl tr.r:hover td { background: var(--dsw-alias-interactive-bg-hover); }
  .c-tbl tr.r.sel td { background: var(--dsw-alias-interactive-bg-active); }
  .c-tbl tr.r.is-new td.t { font-weight: var(--dsw-font-xs-strong-13-font-weight); }
  .c-tbl .ti { display: flex; align-items: center; gap: 8px; }
  .c-wrap.open .c-hide { display: none; }

  /* the prototype switcher: not a part of the design */
  .proto { white-space: nowrap; position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 99; display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 999px; background: #111; color: #fff; font: 12px/1.4 ui-monospace, Menlo, monospace; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); border: 1px solid #f5a524; }
  .proto button { width: 28px; height: 28px; border-radius: 50%; border: 0; background: #333; color: #fff; cursor: pointer; font-size: 14px; }
  .proto button:hover { background: #555; }
  .proto .st { color: #aaa; border-left: 1px solid #444; padding-left: 12px; }
  .proto b { color: #f5a524; }
  .proto .seg { display: flex; padding: 2px; border-radius: 999px; background: #333; }

  .ap-t th { text-align: left; font-weight: 400; font-size: var(--dsw-font-xxs-12-font-size); color: var(--dsw-alias-label-secondary); padding: 4px 12px 4px 0; border-bottom: 0.5px solid var(--dsw-alias-border-l3); white-space: nowrap; }
  .ap-t td { padding: 8px 12px 8px 0; border-bottom: 0.5px solid var(--dsw-alias-border-l3); vertical-align: top; overflow-wrap: anywhere; }
  .ap-t td.nw { white-space: nowrap; }
  .ap-t td.r, .ap-t th.r { text-align: right; padding-right: 0; }
  .ap-list { margin: 0; padding: 0; list-style: none; }
  .ap-list li { padding: 4px 0; overflow-wrap: anywhere; }
  .ap-more { border: 0; background: none; padding: 0; color: var(--dsw-alias-label-secondary); font: inherit; text-decoration: underline; cursor: pointer; }
  .ap-none { color: var(--dsw-alias-label-secondary); }
  .ap-row2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 8px; padding: 12px 16px; border-bottom: 0.5px solid var(--dsw-alias-border-l3); cursor: pointer; position: relative; }
  .ap-row2:hover { background: var(--dsw-alias-interactive-bg-hover); }
  .ap-row2.sel { background: var(--dsw-alias-interactive-bg-active); }
  .ap-row2.sel::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--dsw-alias-state-business-primary); }
  .ap-row2 .ref { font-weight: var(--dsw-font-xs-strong-13-font-weight); }
  .b-apps { height: 100%; overflow: auto; }
  .bt { width: 100%; border-collapse: collapse; }
  .bt th { position: sticky; top: 0; z-index: 2; height: 32px; padding: 0 16px; text-align: left; font-weight: 400; font-size: var(--dsw-font-xxs-12-font-size); color: var(--dsw-alias-label-secondary); background: var(--dsw-alias-bg-base); border-bottom: 0.5px solid var(--dsw-alias-border-l3); white-space: nowrap; cursor: pointer; user-select: none; }

  .bt td { height: 44px; padding: 0 16px; border-bottom: 0.5px solid var(--dsw-alias-border-l3); white-space: nowrap; max-width: 320px; }
  .bt tr.r { cursor: pointer; } .bt tr.r:hover td { background: var(--dsw-alias-interactive-bg-hover); } .bt tr.r.sel td { background: var(--dsw-alias-interactive-bg-active); }
  .bt td > [data-cut] { display: block; }
  .c-wrap.open .bt .c-hide { display: none; }
  @media (max-width: 1100px) { .bt .hide-n { display: none; } }
</style>

<script>

  const v = VIEWS(), all = shown(), list = all.slice(0, S.limit), sel = APPS.find(a => key(a) === S.sel);
  const f = x => `<button class="a-f${S.view === x.id ? ' on' : ''}" data-view="${x.id}">${ico(x.folder ? 'folder' : 'inbox')}${line(esc(x.label))}<span class="n p-num">${int(count(x))}</span></button>`;
  return `<div class="a-wrap${sel ? ' has-sel' : ''}">
  <div class="a-folders"><div class="a-fh">MyEPO applications</div>${v.filter(x => !x.folder).map(f).join('')}<div class="a-fh">Portfolios</div>${v.filter(x => x.folder).map(f).join('')}</div>
  <div class="a-list"><div class="p-bar"><select class="a-select" id="view" aria-label="View">${v.map(x => `<option value="${x.id}"${S.view === x.id ? ' selected' : ''}>${esc(x.label)} (${int(count(x))})</option>`).join('')}</select>${search()}</div><div class="rows">${list.map(a => `<div class="ap-row2${key(a) === S.sel ? ' sel' : ''}" data-id="${esc(key(a))}">
    ${line(a.reference ? esc(a.reference) : '<span class="p-muted">No reference</span>', 'ref')}<span>${proc(a)}</span>
    ${line(titleOf(a) ? esc(titleOf(a)) : '<span class="p-muted">Title not read</span>')}<span class="p-muted p-num" style="font-size:12px">${date(a.filingDate)}</span>
    ${line(`${esc(a.number)}${applicantOf(a) ? ` · ${esc(applicantOf(a))}` : ''}`, 'p-muted p-num')}<span>${nextDue(a) ? `<span class="p-muted" style="font-size:12px">Due ${date(nextDue(a))}</span>` : ''}</span></div>`).join('') || emptyRows()}${moreBtn(all, list)}</div></div>
  <div class="a-read">${application(sel)}</div></div>`;
}

// ---- variant B: the docket as a table ----
function VariantB() {
  const all = shown(), list = all.slice(0, S.limit), sel = APPS.find(a => key(a) === S.sel);
  const th = (id, label, cls = '') => `<th data-sort="${id}" class="${cls}"${S.sort === id ? ` aria-sort="${S.dir}"` : ''}>${label}</th>`;
  return `<div class="p-bar"><h1>Applications</h1>${search()}${VIEWS().filter(x => !x.folder).map(x => `<button class="p-chip${S.view === x.id ? ' on' : ''}" data-view="${x.id}">${esc(x.label)} <span class="p-num">${int(count(x))}</span></button>`).join('')}
    <select class="p-btn" id="view" aria-label="Portfolio" style="max-width:220px"><option value="all">Portfolio: all</option>${VIEWS().filter(x => x.folder).map(x => `<option value="${x.id}"${S.view === x.id ? ' selected' : ''}>${esc(x.label)} (${int(count(x))})</option>`).join('')}</select></div>
  <div class="c-wrap${sel ? ' open' : ''}"><div class="b-apps">${list.length ? `<table class="bt"><thead><tr>${th('reference', 'Your reference')}${th('number', 'Application')}<th>Type</th>${th('title', 'Title', 'c-hide')}<th class="c-hide hide-n">Applicant</th>${th('portfolio', 'Portfolio', 'c-hide hide-n')}${th('filingDate', 'Filed')}${th('due', 'Next due date')}</tr></thead><tbody>${list.map(a => `<tr class="r${key(a) === S.sel ? ' sel' : ''}" data-id="${esc(key(a))}">
    <td>${line(a.reference ? esc(a.reference) : none)}</td><td class="p-num">${line(esc(a.number))}</td><td>${proc(a)}</td>
    <td class="c-hide">${line(titleOf(a) ? esc(titleOf(a)) : '<span class="ap-none">Not read</span>')}</td><td class="c-hide hide-n">${line(applicantOf(a) ? esc(applicantOf(a)) : none)}</td><td class="c-hide hide-n">${line(esc(a.portfolioName))}</td>
    <td class="p-num">${date(a.filingDate)}</td><td>${dueCell(nextDue(a))}</td></tr>`).join('')}</tbody></table>${moreBtn(all, list)}` : emptyRows()}</div>
  ${sel ? `<div class="c-side">${application(sel)}</div>` : ''}</div>`;
}

// ---- render and the switcher ----
const root = document.getElementById('root'), proto = document.getElementById('proto');
function render() {
  const focused = document.activeElement?.id === 'q';
  root.innerHTML = { A: VariantA, B: VariantB }[S.variant]();
  cut();
  if (focused) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  proto.innerHTML = `<button data-v="-1">‹</button><span><b>${S.variant}</b> ${VARIANTS[S.variant]}</span><button data-v="1">›</button><span class="seg">${Object.entries(DATASETS).map(([k, w]) => `<a href="?${new URLSearchParams({ ...Object.fromEntries(url), data: k, variant: S.variant })}" class="${k === dataKey ? 'on' : ''}">${w}</a>`).join('')}</span><span class="st">PROTOTYPE · shown=${shown().length}/${APPS.length} · open=${S.sel ?? 'none'}</span>`;
}
const cycle = n => { const k = Object.keys(VARIANTS); S.variant = k[(k.indexOf(S.variant) + n + k.length) % k.length]; url.set('variant', S.variant); history.replaceState(null, '', `?${url}`); render(); };
function step(n) { const list = shown(); if (!list.length) return; const i = list.findIndex(a => key(a) === S.sel); S.sel = key(list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + n))]); render(); }
document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) return cycle(Number(v.dataset.v));
  const all = e.target.closest('[data-all]'); if (all) { S.all[all.dataset.all] = !S.all[all.dataset.all]; return render(); }
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close') { S.sel = null; return render(); }
  if (act === 'prev') return step(-1);
  if (act === 'next') return step(1);
  if (act === 'more') { S.limit += PAGE; return render(); }
  const sort = e.target.closest('[data-sort]'); if (sort) { S.dir = S.sort === sort.dataset.sort && S.dir === 'ascending' ? 'descending' : 'ascending'; S.sort = sort.dataset.sort; return render(); }
  const view = e.target.closest('[data-view]'); if (view) { S.view = view.dataset.view; S.limit = PAGE; return render(); }
  const row = e.target.closest('[data-id]'); if (row) { S.sel = row.dataset.id; render(); }
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; S.limit = PAGE; render(); } });
document.addEventListener('change', e => { if (e.target.id === 'view') { S.view = e.target.value; S.limit = PAGE; render(); } });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'ArrowLeft') cycle(-1); else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Escape') { S.sel = null; render(); }
  else if (e.key === '/') { e.preventDefault(); document.getElementById('q')?.focus(); }
});
addEventListener('resize', cut);
render();
</script>
</body>
</html>
