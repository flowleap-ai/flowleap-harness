];
const MANY = n => Array.from({ length: n }, (_, i) => { const b = (i % 3 ? DEMO_LETTERS : WORST_LETTERS)[i % 9]; const d = new Date(Date.UTC(2026, 10, 14) - i * 36e5 * 7); return { ...b, id: `m${i}`, read: i % 4 === 0, handled: i % 5 === 0, dispatchDate: d.toISOString().slice(0, 10) }; });
const DATASETS = { demo: 'Demo data', worst: 'Worst case', empty: 'Empty', one: 'One', many: '1,284 rows' };
const dataKey = DATASETS[new URLSearchParams(location.search).get('data')] ? new URLSearchParams(location.search).get('data') : 'demo';
const clone = a => a.map(x => ({ ...x }));
const FOLDERS = dataKey === 'demo' || dataKey === 'empty' ? DEMO_FOLDERS : WORST_FOLDERS;
const LETTERS = { demo: () => clone(DEMO_LETTERS), worst: () => clone(WORST_LETTERS), empty: () => [], one: () => clone(WORST_LETTERS.slice(0, 1)), many: () => MANY(1284) }[dataKey]();

// ---- state: in memory only ----
const VARIANTS = { A: 'Three panes (Outlook)', B: 'Full rows + drawer (Gmail)', C: 'Table by application' };
const url = new URLSearchParams(location.search);
const PAGE = 100;
const S = { variant: VARIANTS[url.get('variant')] ? url.get('variant') : 'A', sel: null, view: 'all', q: '', opened: {}, wide: false, zoom: 1, fit: true, full: false, limit: PAGE };

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const MO = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const date = iso => { const [y, m, d] = iso.split('-'); return `${Number(d)} ${MO[m - 1]} ${y}`; };
const none = '<span class="p-muted">None</span>';
const folderName = id => FOLDERS.find(f => f.folderId === id)?.folderName ?? 'Unknown folder';
const int = n => n.toLocaleString('en-GB');
const titleOf = l => (l.title ?? '').trim() ? esc(l.title) : `<span class="p-muted">No title (document ${esc(l.documentCode)})</span>`;
/** One line that fades when it does not fit; cut() gives it the full text as its title. dir=auto puts a right-to-left name on its side. */
const line = (html, cls = '') => `<span data-cut dir="auto" class="${cls}">${html}</span>`;
function cut() { for (const el of document.querySelectorAll('[data-cut]')) { const over = el.scrollWidth > el.clientWidth + 1; el.classList.toggle('is-cut', over); if (over) el.title = el.textContent; else el.removeAttribute('title'); } }
const I = {
  inbox: '<path d="M2.5 9.5 4.5 3.5h7l2 6v3h-11z"/><path d="M2.5 9.5h3l1 1.5h3l1-1.5h3"/>', mail: '<rect x="2.5" y="3.5" width="11" height="9" rx="1.5"/><path d="m3 4.5 5 4 5-4"/>',
  back: '<path d="M10 4 6 8l4 4"/>', expand: '<path d="M9.5 3h3.5v3.5M6.5 13H3V9.5M13 3 9 7M3 13l4-4"/>', shrink: '<path d="M13 6.5H9.5V3M3 9.5h3.5V13M9.5 6.5 13 3M6.5 9.5 3 13"/>', minus: '<path d="M4 8h8"/>', plus: '<path d="M8 4v8M4 8h8"/>',
  flag: '<circle cx="8" cy="8" r="5.6" stroke-dasharray="2.2 1.6"/><circle cx="8" cy="8" r="1.6"/>', folder: '<path d="M2.5 4.5h4l1.5 1.5h5.5v6.5h-11z"/>',
  search: '<circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/>', x: '<path d="M4.5 4.5l7 7M11.5 4.5l-7 7"/>', download: '<path d="M8 3v7M5 7l3 3 3-3"/><path d="M3 11v2h10v-2"/>',
  ext: '<path d="M9 3h4v4M13 3 7.5 8.5M11.5 9.5v3.5h-9v-9h3.5"/>', up: '<path d="M4.5 9.5 8 6l3.5 3.5"/>', down: '<path d="M4.5 6.5 8 10l3.5-3.5"/>', info: '<circle cx="8" cy="8" r="5.75"/><path d="M8 7.5v3.5M8 5.2v.1"/>',
};
const ico = n => `<svg class="p-ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${I[n]}</svg>`;

const VIEWS = () => [
  { id: 'all', label: 'All letters', icon: 'inbox', test: () => true },
  { id: 'unread', label: 'Unread', icon: 'mail', test: l => !l.read },
  { id: 'open', label: 'Not handled', icon: 'flag', test: l => !l.handled },
  ...FOLDERS.map(f => ({ id: f.folderId, label: f.folderName, icon: 'folder', folder: true, test: l => l.folderId === f.folderId })),
];
const shown = () => { const v = VIEWS().find(x => x.id === S.view); const q = S.q.trim().toLowerCase(); return LETTERS.filter(l => v.test(l) && (!q || [l.title, l.applicationNumber, l.userReference, l.applicantName, l.documentCode].join(' ').toLowerCase().includes(q))); };
const count = v => LETTERS.filter(v.test).length;

// ---- acts ----
function select(id) { S.sel = id; S.full = false; const l = LETTERS.find(x => x.id === id); if (l && !l.read) { l.read = true; S.opened[id] = true; } render(); }
function step(n) { const list = shown(); if (!list.length) return; const i = list.findIndex(l => l.id === S.sel); select(list[Math.max(0, Math.min(list.length - 1, i < 0 ? 0 : i + n))].id); }
function setVariant(v) { S.variant = v; url.set('variant', v); history.replaceState(null, '', `?${url}`); render(); }

// ---- the letter (shared) ----
function letter(l) {
  if (!l) return `<div class="lt"><div class="p-empty"><div>${ico('mail')}<p>${LETTERS.length ? 'Select a letter to read it.' : 'No letter to read.'}</p></div></div></div>`;
  const prop = (k, v) => `<div><div class="k">${k}</div><div class="p-wrap" dir="auto">${v}</div></div>`;
  const long = (l.title ?? '').length > 160;
  return `<div class="lt">
  <div class="lt-top"><div class="lt-top-in">
    <button class="p-btn ghost lt-crumb" data-act="back" title="Back to the letters (Esc)">${ico('back')}<span class="lbl">Letters</span></button>
    <button class="p-btn icon ghost" data-act="prev" title="Previous letter (K)">${ico('up')}</button><button class="p-btn icon ghost" data-act="next" title="Next letter (J)">${ico('down')}</button>
    <span class="sp"></span>
    ${l.digitalFile ? `<a class="p-btn ghost" href="${esc(l.digitalFile)}" target="_blank" rel="noreferrer" title="Open in MyEPO">${ico('ext')}<span class="lbl">Open in MyEPO</span></a>` : ''}
    <button class="p-btn" title="Download PDF">${ico('download')}<span class="lbl">Download PDF</span></button>
    <button class="p-btn icon ghost" data-act="close" title="Close (Esc)">${ico('x')}</button>
  </div></div>
  <div class="lt-scroll">
    <div class="lt-tags"><span class="p-tag ${l.handled ? 'ok' : 'warn'}">${l.handled ? 'Handled' : 'Not handled'}</span><span class="p-tag" title="${esc(folderName(l.folderId))}">${esc(folderName(l.folderId))}</span><span class="p-tag" title="${esc(l.documentCode)}">${esc(l.documentCode)}</span></div>
    <h2 class="p-wrap${long && !S.full ? ' clamp' : ''}" dir="auto">${titleOf(l)}</h2>
    ${long ? `<button class="lt-more" data-act="full">${S.full ? 'Show less' : 'Show the full title'}</button>` : ''}
    <div class="lt-props">
      ${prop('Application', l.applicationNumber ? `<span class="p-num">${esc(l.applicationNumber)}</span>` : none)}
      ${prop('Your reference', l.userReference ? esc(l.userReference) : none)}
      ${prop('Applicant', l.applicantName ? esc(l.applicantName) : none)}
      ${prop('Recipient', esc(l.recipientName))}
      ${prop('Dispatched', `<span class="p-num">${date(l.dispatchDate)}</span>`)}
      ${prop('Read', 'Read in MyEPO')}
    </div>
    ${S.opened[l.id] ? `<div class="lt-note">${ico('info')}<span>You opened this letter. MyEPO now shows it as read for your firm.</span></div>` : ''}
    <div class="pdf-bar">
      <span class="pg p-num">Page 1 of 4</span><span class="sp"></span>
      <button class="p-btn icon ghost" data-act="zoom-out" title="Zoom out (-)">${ico('minus')}</button><span class="z">${Math.round(S.zoom * 100)} %</span><button class="p-btn icon ghost" data-act="zoom-in" title="Zoom in (+)">${ico('plus')}</button>
      <button class="p-btn ghost" data-act="fit" title="Fit the page to the width (0)">Fit</button>
      <button class="p-btn" data-act="wide" title="${S.wide ? 'Back to three panes (F)' : 'Read in the full width (F)'}">${ico(S.wide ? 'shrink' : 'expand')}<span class="lbl">${S.wide ? 'Three panes' : 'Read wide'}</span></button>
    </div>
    <div class="pdf-stage"><div class="lt-sheet" style="width:${Math.round(640 * S.zoom)}px;font-size:${(12 * S.zoom).toFixed(1)}px;padding:${Math.round(40 * S.zoom)}px">
      <div class="hd"><span>European Patent Office<br>80298 Munich, Germany</span><span>${date(l.dispatchDate)}<br>${esc(l.documentCode)}</span></div>
      <div dir="auto">${esc(l.recipientName)}</div>
      <div class="p-wrap">${l.applicationNumber ? `Application No. ${esc(l.applicationNumber)}` : ''}${l.userReference ? ` · Ref. ${esc(l.userReference)}` : ''}</div>
      <b class="p-wrap" style="font-size:inherit">${titleOf(l)}</b>
      ${'<div class="ln"></div>'.repeat(9)}<div class="ln" style="width:60%"></div><br>${'<div class="ln"></div>'.repeat(6)}<div class="ln" style="width:35%"></div>
    </div></div>
  </div></div>`;
}
const search = () => `<label class="p-search">${ico('search')}<input id="q" placeholder="Find a letter" value="${esc(S.q)}" autocomplete="off"></label>`;
const emptyRows = () => `<div class="p-empty">${LETTERS.length ? 'No letter matches.' : 'The MyEPO Mailbox has no letters.'}</div>`;

// ---- variant A: folders, list, reading pane ----
function VariantA() {
  const v = VIEWS(), all = shown(), list = all.slice(0, S.limit), sel = LETTERS.find(l => l.id === S.sel);
  const f = x => `<button class="a-f${S.view === x.id ? ' on' : ''}" data-view="${x.id}">${ico(x.icon)}${line(esc(x.label))}<span class="n p-num">${int(count(x))}</span></button>`;
  return `<div class="a-wrap${sel ? ' has-sel' : ''}${sel && S.wide ? ' wide' : ''}">
  <div class="a-folders"><div class="a-fh">MyEPO Mailbox</div>${v.filter(x => !x.folder).map(f).join('')}<div class="a-fh">Folders</div>${v.filter(x => x.folder).map(f).join('')}</div>
  <div class="a-list"><div class="p-bar"><select class="a-select" id="view" aria-label="View">${v.map(x => `<option value="${x.id}"${S.view === x.id ? ' selected' : ''}>${esc(x.label)} (${int(count(x))})</option>`).join('')}</select>${search()}</div><div class="rows">${list.map(l => `<div class="a-row${l.id === S.sel ? ' sel' : ''}${l.read ? '' : ' is-new'}" data-id="${l.id}">
    <span class="p-dot${l.read ? ' off' : ''}"></span>
    <div style="min-width:0"><div class="l1">${line(l.applicantName ? esc(l.applicantName) : '<span class="p-muted">No applicant</span>', 'p-who')}<span class="d p-num">${date(l.dispatchDate)}</span></div>
    <div class="t" dir="auto" title="${esc(l.title)}">${titleOf(l)}</div>
    <div class="p-muted p-num" style="display:flex">${line([l.userReference, l.applicationNumber].filter(Boolean).map(esc).join(' · ') || 'No application')}</div></div></div>`).join('') || emptyRows()}
    ${all.length > list.length ? `<button class="p-btn p-more" data-act="more">Show ${int(Math.min(PAGE, all.length - list.length))} more of ${int(all.length)}</button>` : ''}</div></div>
  <div class="a-read">${letter(sel)}</div></div>`;
}

// ---- variant B: full-width rows, the letter in a drawer ----
function VariantB() {
  const list = shown(), sel = LETTERS.find(l => l.id === S.sel);
  return `<div class="p-bar"><h1>Letters</h1>${search()}<span class="p-muted">MyEPO Mailbox · ${LETTERS.length} letters · ${LETTERS.filter(l => !l.read).length} unread</span></div>
  <div class="b-tabs">${VIEWS().map(x => `<button class="p-chip${S.view === x.id ? ' on' : ''}" data-view="${x.id}">${ico(x.icon)}${esc(x.label)} <span class="p-num">${count(x)}</span></button>`).join('')}</div>
  <div class="b-body"><div class="b-rows">${list.map(l => `<div class="b-row${l.id === S.sel ? ' sel' : ''}${l.read ? '' : ' is-new'}" data-id="${l.id}">
    <span class="p-dot${l.read ? ' off' : ''}"></span>
    <span class="p-who p-ell">${l.applicantName ? esc(l.applicantName) : '<span class="p-muted">No applicant</span>'}</span>
    <span class="p-ell"><span class="t">${titleOf(l)}</span>${l.userReference ? ` <span class="p-muted">· ${esc(l.userReference)}</span>` : ''}</span>
    <span class="p-num p-ell hide-n">${l.applicationNumber ? esc(l.applicationNumber) : none}</span>
    <span class="hide-n"><span class="p-tag ${l.handled ? 'ok' : 'warn'}">${l.handled ? 'Handled' : 'Not handled'}</span></span>
    <span class="d p-num">${date(l.dispatchDate)}</span></div>`).join('') || emptyRows()}</div>
  <div class="b-drawer${sel ? ' open' : ''}">${sel ? letter(sel) : ''}</div></div>`;
}

// ---- variant C: a table grouped by application, the letter beside it ----
function VariantC() {
  const list = shown(), sel = LETTERS.find(l => l.id === S.sel);
  const groups = new Map();
  for (const l of list) { const k = l.applicationNumber ?? ''; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(l); }
  const body = [...groups].map(([k, ls]) => `<tr class="g"><td colspan="6"><span class="p-strong p-num">${k ? esc(k) : 'No application'}</span> <span class="p-muted">· ${ls.length} ${ls.length === 1 ? 'letter' : 'letters'}</span></td></tr>
  ${ls.map(l => `<tr class="r${l.id === S.sel ? ' sel' : ''}${l.read ? '' : ' is-new'}" data-id="${l.id}">
    <td class="t"><span class="ti"><span class="p-dot${l.read ? ' off' : ''}"></span>${esc(l.title)}</span></td>
    <td>${l.userReference ? esc(l.userReference) : none}</td>
    <td class="c-hide">${l.applicantName ? esc(l.applicantName) : none}</td>
    <td class="c-hide">${esc(folderName(l.folderId))}</td>
    <td class="p-num">${date(l.dispatchDate)}</td>
    <td class="c-hide"><span class="p-tag ${l.handled ? 'ok' : 'warn'}">${l.handled ? 'Handled' : 'Not handled'}</span></td></tr>`).join('')}`).join('');
  return `<div class="p-bar"><h1>Letters</h1>${search()}${VIEWS().filter(x => !x.folder).map(x => `<button class="p-chip${S.view === x.id ? ' on' : ''}" data-view="${x.id}">${esc(x.label)} <span class="p-num">${count(x)}</span></button>`).join('')}</div>
  <div class="c-wrap${sel ? ' open' : ''}"><div>${list.length ? `<table class="c-tbl"><thead><tr><th>Document</th><th>Your reference</th><th class="c-hide">Applicant</th><th class="c-hide">Folder</th><th>Dispatched</th><th class="c-hide">Handled</th></tr></thead><tbody>${body}</tbody></table>` : emptyRows()}</div>
  ${sel ? `<div class="c-side">${letter(sel)}</div>` : ''}</div>`;
}

// ---- render and the switcher ----
const root = document.getElementById('root'), proto = document.getElementById('proto');
function render() {
  const focused = document.activeElement?.id === 'q';
  root.innerHTML = { A: VariantA, B: VariantB, C: VariantC }[S.variant]();
  if (S.fit) { const st = document.querySelector('.pdf-stage'), sh = st?.querySelector('.lt-sheet'); if (sh && st.clientWidth) { S.zoom = Math.max(0.5, Math.min(1.6, +((st.clientWidth - 32) / 640).toFixed(2))); sh.style.width = `${Math.round(640 * S.zoom)}px`; sh.style.fontSize = `${(12 * S.zoom).toFixed(1)}px`; sh.style.padding = `${Math.round(40 * S.zoom)}px`; const z = document.querySelector('.pdf-bar .z'); if (z) z.textContent = `${Math.round(S.zoom * 100)} %`; } }
  cut();
  if (focused) { const q = document.getElementById('q'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }
  const sel = LETTERS.find(l => l.id === S.sel);
  proto.innerHTML = `<button data-v="-1" title="Previous variant (←)">‹</button><span><b>${S.variant}</b> ${VARIANTS[S.variant]}</span><button data-v="1" title="Next variant (→)">›</button>
  <span class="seg">${Object.entries(DATASETS).map(([k, w]) => `<a href="?${new URLSearchParams({ ...Object.fromEntries(url), data: k })}" class="${k === dataKey ? 'on' : ''}">${w}</a>`).join('')}</span><span class="st">PROTOTYPE · view=${S.view} · shown=${shown().length}/${LETTERS.length} · unread=${LETTERS.filter(l => !l.read).length} · open=${sel ? sel.documentCode : 'none'}</span>`;
}
const cycle = n => { const k = Object.keys(VARIANTS); setVariant(k[(k.indexOf(S.variant) + n + k.length) % k.length]); };
document.addEventListener('click', e => {
  const v = e.target.closest('[data-v]'); if (v) return cycle(Number(v.dataset.v));
  const act = e.target.closest('[data-act]')?.dataset.act;
  if (act === 'close' || act === 'back') { if (S.wide && act === 'back') S.wide = false; else { S.sel = null; S.wide = false; } return render(); }
  if (act === 'wide') { S.wide = !S.wide; S.fit = true; return render(); }
  if (act === 'zoom-in' || act === 'zoom-out') { S.fit = false; S.zoom = Math.max(0.5, Math.min(3, +(S.zoom + (act === 'zoom-in' ? 0.2 : -0.2)).toFixed(1))); return render(); }
  if (act === 'fit') return fit();
  if (act === 'full') { S.full = !S.full; return render(); }
  if (act === 'more') { S.limit += PAGE; return render(); }
  if (act === 'prev') return step(-1);
  if (act === 'next') return step(1);
  const view = e.target.closest('[data-view]'); if (view) { S.view = view.dataset.view; S.limit = PAGE; return render(); }
  const row = e.target.closest('[data-id]'); if (row) select(row.dataset.id);
});
document.addEventListener('input', e => { if (e.target.id === 'q') { S.q = e.target.value; S.limit = PAGE; render(); } });
document.addEventListener('change', e => { if (e.target.id === 'view') { S.view = e.target.value; S.limit = PAGE; render(); } });
function fit() { S.fit = true; render(); }
addEventListener('resize', () => { if (S.fit && S.sel) render(); else cut(); });
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, [contenteditable]')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.key === 'ArrowLeft') cycle(-1);
  else if (e.key === 'ArrowRight') cycle(1);
  else if (e.key === 'j' || e.key === 'ArrowDown') { e.preventDefault(); step(1); }
  else if (e.key === 'k' || e.key === 'ArrowUp') { e.preventDefault(); step(-1); }
  else if (e.key === 'Escape') { if (S.wide) S.wide = false; else S.sel = null; render(); }
  else if (e.key === 'f' && S.sel) { S.wide = !S.wide; S.fit = true; render(); }
  else if (e.key === '+' || e.key === '=') { S.fit = false; S.zoom = Math.min(3, +(S.zoom + 0.2).toFixed(1)); render(); }
  else if (e.key === '-') { S.fit = false; S.zoom = Math.max(0.5, +(S.zoom - 0.2).toFixed(1)); render(); }
  else if (e.key === '0') fit();
  else if (e.key === '/') { e.preventDefault(); document.getElementById('q')?.focus(); }
});
render();
</script>
